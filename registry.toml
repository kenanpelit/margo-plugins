# margo-plugins registry
#
# Index of every plugin offered by this source. mshell shallow-clones just
# this file to populate Settings → Widgets → Plugins → Available.
#
# Add one [[plugins]] entry per plugin. `dir` is the folder in this repo that
# holds the plugin's manifest.toml; `version` must match that manifest.
#
[[plugins]]
id = "network-speed"
dir = "network-speed"
version = "1.1.0"
name = "Network Speed"
min_mshell = "0.8.8"
description = "Live ↓/↑ network throughput across all interfaces; click for a quick network menu."

[[plugins]]
id = "breathing"
dir = "breathing"
version = "0.1.0"
name = "Breathing"
min_mshell = "0.8.8"
description = "Guided breathing exercises for calm & focus — 6 techniques (Deep, 4-7-8, Box, Equal, Resonance, Alternate Nostril) with a live breathing orb, phase coaching, and a duration timer. In-shell panel; optional chime cues need paplay."
icon = "weather-windy-symbolic"

[[plugins]]
id = "ambient-sound"
dir = "ambient-sound"
version = "0.1.0"
name = "Ambient Sound"
min_mshell = "0.8.8"
description = "Ambient soundscapes for focus & sleep — 14 looping sounds (rain, storm, waves, fireplace, coffee shop, …) you can mix, save as presets, and auto-stop with a sleep timer (Stop / Lock / Suspend). In-shell mixer panel. Needs mpv + socat."
icon = "audio-headphones-symbolic"

[[plugins]]
id = "assistant-panel"
dir = "assistant-panel"
version = "0.4.0"
name = "Assistant Panel"
min_mshell = "0.8.8"
description = "Multi-provider AI chat (Gemini, OpenAI-compatible, Anthropic, Ollama, custom). Streaming, markdown, persistent history, header actions (Stop / Retry / Copy / New). Falls back to a terminal chat (curl + jq) on a non-wasm-plugins build."

[[plugins]]
id = "mullvad"
dir = "mullvad"
version = "0.2.1"
name = "Mullvad VPN"
min_mshell = "0.8.8"
description = "Mullvad VPN: rich in-shell control panel — status, connect/disconnect/reconnect, lockdown + auto-connect toggles, searchable country list. Needs the mullvad CLI + a wasm-plugins mshell."

[[plugins]]
id = "demo-kit"
dir = "demo-kit"
version = "0.1.0"
name = "Demo Kit"
min_mshell = "0.8.8"
description = "Reference plugin exercising every node kind and host capability the WASM tier ships. Install it to see what plugins can do — and read its source as a guided tour of mplugin-sdk."
icon = "applications-engineering-symbolic"

[[plugins]]
id = "system-monitor"
dir = "system-monitor"
version = "0.1.0"
name = "System Monitor"
min_mshell = "0.8.8"
description = "Live RAM / load / disk / uptime + battery + network in a single panel. Reads /proc through the host's `run` capability and pulls battery/network from `system-state`."
icon = "utilities-system-monitor-symbolic"

[[plugins]]
id = "todo"
dir = "todo"
version = "0.1.0"
name = "Todo"
min_mshell = "0.8.8"
description = "Lightweight task list. Items live in the plugin's data dir via the host's scoped write-file capability — no network, no shell-outs."
icon = "checkbox-checked-symbolic"

[[plugins]]
id = "model-usage"
dir = "model-usage"
version = "0.1.0"
name = "Model Usage"
min_mshell = "0.8.8"
description = "AI assistant usage stats (Claude Code from ~/.claude/stats-cache.json + OpenRouter from /api/v1/key). Tabbed panel with today/lifetime cards, recent-day bar chart, and tokens-by-model breakdown. Port of the noctalia plugin with matugen styling + keyring-backed API keys."
icon = "applications-development-symbolic"

[[plugins]]
id = "show-keys"
dir = "show-keys"
version = "0.1.0"
name = "Show Keys"
min_mshell = "0.8.8"
description = "Live keyboard-input display via evtest — useful for screen recordings + tutorials. Streams evtest stdout through the host's process-start capability and renders recent keys as primary-container pills. Needs evtest + your user in the `input` group."
icon = "input-keyboard-symbolic"

[[plugins]]
id = "color-scheme-creator"
dir = "color-scheme-creator"
version = "0.1.1"
name = "Color Scheme Creator"
min_mshell = "0.8.8"
description = "Manage curated color schemes for margo's compositor palette. Save the current ~/.config/margo/colors.conf as a named preset, apply a saved preset (cp + mctl reload), or hex-edit any of the seven tokens inline — each shown next to a live colour swatch. Port of the noctalia plugin scoped to margo's compositor palette."
icon = "color-select-symbolic"
