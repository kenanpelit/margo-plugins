# margo-plugins registry
#
# Index of every plugin offered by this source. mshell shallow-clones just
# this file to populate Settings → Widgets → Plugins → Available.
#
# Add one [[plugins]] entry per plugin. `dir` is the folder in this repo that
# holds the plugin's manifest.toml; `version` must match that manifest.
#
[[plugins]]
id = "network-speed"
dir = "network-speed"
version = "1.1.0"
name = "Network Speed"
min_mshell = "0.8.8"
description = "Live ↓/↑ network throughput across all interfaces; click for a quick network menu."

[[plugins]]
id = "assistant-panel"
dir = "assistant-panel"
version = "0.3.3"
name = "Assistant Panel"
min_mshell = "0.8.8"
description = "AI assistant (Gemini): set model + API key, click for an in-shell streaming chat panel (wasm-plugins build) or a terminal chat. Needs curl + jq for the fallback."

[[plugins]]
id = "mullvad"
dir = "mullvad"
version = "0.1.1"
name = "Mullvad VPN"
min_mshell = "0.8.8"
description = "Mullvad VPN: status pill (active relay / off) + a layer-shell menu to connect / disconnect / reconnect and toggle lockdown. Needs the mullvad CLI."
