id = "assistant-panel"
name = "Assistant Panel"
version = "0.4.2"
author = "kenanpelit"
min_mshell = "0.9.4"
description = "Multi-provider AI chat (Gemini, OpenAI-compatible, Anthropic, Ollama, custom). Streaming, markdown, persistent history, header actions (Stop / Retry / Copy / New). On a non-wasm-plugins build it falls back to a terminal chat (curl + jq)."

# Sandboxed WASM chat panel (the mplugins WASM tier). A `wasm-plugins` build of
# mshell renders this in-shell; older / standard builds ignore it and fall back
# to the terminal `on_click` below.
entry = "plugin.wasm"
entry_kind = "wasm"

# Suggested global hotkey: Super+A opens the panel and focuses the chat input.
[[keybind]]
combo       = "super,a"
id          = "open"
description = "Open the assistant panel and focus the chat input."

# ── Settings ────────────────────────────────────────────────────────────────
# All values flow to the WASM panel via `host::get_setting`. `api_key` is a
# `secret` (masked, stored in the keyring-backed secret store).

[[setting]]
key = "provider"
label = "Provider"
type = "choice"
choices = ["gemini", "openai", "anthropic", "ollama", "custom"]
default = "gemini"

[[setting]]
key = "model"
label = "Model"
type = "string"
default = "gemini-2.5-flash"
description = "Provider-specific model id. Examples: gemini-2.5-flash · gpt-4o-mini · claude-sonnet-4-5-20250929 · llama3 · qwen2.5"

[[setting]]
key = "api_key"
label = "API Key"
type = "secret"
description = "Provider API key. Stored in the keyring. Not required for Ollama or local custom endpoints."

[[setting]]
key = "endpoint"
label = "Endpoint override"
type = "string"
default = ""
description = "Override the provider base URL (proxy, LocalAI, LM Studio, vLLM). Blank = provider default."

[[setting]]
key = "temperature"
label = "Temperature (0.0–2.0)"
type = "string"
default = "0.7"
description = "Lower = focused / deterministic. Higher = creative."

[[setting]]
key = "max_tokens"
label = "Max tokens"
type = "string"
default = "2048"

[[setting]]
key = "system_prompt"
label = "System prompt"
type = "string"
default = ""
description = "Optional system message prepended to every conversation."

[[setting]]
key = "persist_history"
label = "Persist history"
type = "choice"
choices = ["yes", "no"]
default = "yes"
description = "Save the conversation across restarts. Cleared on provider change."

[[setting]]
key = "terminal"
label = "Terminal (fallback)"
type = "string"
default = "kitty"

# ── Bar pill ────────────────────────────────────────────────────────────────
[[widget]]
key = "assistant"
icon = "starred-symbolic"
tooltip = "AI assistant — click to chat"
opens_panel = true
# Terminal fallback for non-wasm-plugins builds (curl + jq, Gemini-only).
on_click = "{{terminal}} -e env GEMINI_API_KEY={{api_key}} sh {{plugin_dir}}/chat.sh {{model}}"
