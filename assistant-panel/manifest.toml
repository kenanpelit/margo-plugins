id = "assistant-panel"
name = "Assistant Panel"
version = "0.3.2"
author = "kenanpelit"
min_mshell = "0.8.8"
description = "AI assistant (Google Gemini). Set model + API key here; click the pill for an in-shell streaming chat panel (on a wasm-plugins build) — otherwise a terminal chat. Needs curl + jq for the terminal fallback."

# Sandboxed WASM chat panel (the mplugins WASM tier). A `wasm-plugins` build of
# mshell renders this in-shell; older / standard builds ignore it and fall back
# to the terminal `on_click` below.
entry = "plugin.wasm"
entry_kind = "wasm"

# Settings flow into both the WASM panel (via get-setting) and the terminal
# command (via {{key}}); api_key is a `secret` (masked, stored 0600).
[[setting]]
key = "model"
label = "Model"
type = "choice"
choices = ["gemini-2.5-flash", "gemini-2.5-pro", "gemini-2.0-flash"]
default = "gemini-2.5-flash"

[[setting]]
key = "api_key"
label = "Gemini API Key"
type = "secret"

[[setting]]
key = "endpoint"
label = "API Endpoint (optional)"
type = "string"
default = ""
description = "Override the Gemini base URL (e.g. a proxy). Blank = Google."

[[setting]]
key = "terminal"
label = "Terminal (fallback)"
type = "string"
default = "kitty"

[[widget]]
key = "assistant"
icon = "starred-symbolic"
tooltip = "AI assistant — click to chat (Gemini)"
# In-shell panel on a wasm-plugins build; this terminal command is the fallback
# everywhere else.
opens_panel = true
on_click = "{{terminal}} -e env GEMINI_API_KEY={{api_key}} sh {{plugin_dir}}/chat.sh {{model}}"
