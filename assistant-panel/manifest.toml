id = "assistant-panel"
name = "Assistant Panel"
version = "0.1.0"
author = "kenanpelit"
min_mshell = "0.8.8"
description = "AI assistant launcher. Configure provider / model / API key here; the pill opens a chat in your terminal. (Declarative port — the in-shell chat panel awaits the WASM tier.)"

# Settings flow into the commands below via {{key}}. The API key is a `secret`
# (masked entry, stored 0600).
[[setting]]
key = "provider"
label = "Provider"
type = "choice"
choices = ["openai", "google", "anthropic", "ollama"]
default = "openai"

[[setting]]
key = "model"
label = "Model"
type = "string"
default = "gpt-4o-mini"

[[setting]]
key = "api_key"
label = "API Key"
type = "secret"

[[setting]]
key = "terminal"
label = "Terminal"
type = "string"
default = "kitty"

[[widget]]
key = "assistant"
icon = "starred-symbolic"
tooltip = "AI assistant — click to chat"
# Opens an interactive AI chat in a terminal, configured from the settings.
# Uses `aichat` (https://github.com/sigoden/aichat); adapt for your CLI/provider.
on_click = "{{terminal}} -e env OPENAI_API_KEY={{api_key}} aichat -m {{provider}}:{{model}}"

[[widget.menu]]
label = "Chat"
icon = "chat-symbolic"
exec = "{{terminal}} -e env OPENAI_API_KEY={{api_key}} aichat -m {{provider}}:{{model}}"

[[widget.menu]]
label = "Show config"
icon = "dialog-information-symbolic"
exec = "notify-send Assistant 'provider={{provider}} · model={{model}}'"
