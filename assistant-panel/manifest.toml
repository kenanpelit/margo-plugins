id = "assistant-panel"
name = "Assistant Panel"
version = "0.2.0"
author = "kenanpelit"
min_mshell = "0.8.8"
description = "AI assistant (Google Gemini). Set your model + API key here; click the pill to chat in your terminal. Needs curl + jq."

# Settings flow into the launch command via {{key}}; api_key is a `secret`
# (masked, stored 0600). `{{plugin_dir}}` is the built-in install path, so the
# pill runs the bundled chat.sh.
[[setting]]
key = "model"
label = "Model"
type = "choice"
choices = ["gemini-2.5-flash", "gemini-2.5-pro", "gemini-2.0-flash"]
default = "gemini-2.5-flash"

[[setting]]
key = "api_key"
label = "Gemini API Key"
type = "secret"

[[setting]]
key = "terminal"
label = "Terminal"
type = "string"
default = "kitty"

[[widget]]
key = "assistant"
icon = "starred-symbolic"
tooltip = "AI assistant — click to chat (Gemini)"
on_click = "{{terminal}} -e env GEMINI_API_KEY={{api_key}} sh {{plugin_dir}}/chat.sh {{model}}"

[[widget.menu]]
label = "Chat"
icon = "chat-symbolic"
exec = "{{terminal}} -e env GEMINI_API_KEY={{api_key}} sh {{plugin_dir}}/chat.sh {{model}}"

[[widget.menu]]
label = "Show config"
icon = "dialog-information-symbolic"
exec = "notify-send Assistant 'model={{model}}'"
