id = "mullvad"
name = "Mullvad VPN"
version = "0.2.1"
author = "kenanpelit"
min_mshell = "0.8.8"
description = "Mullvad VPN control — a rich in-shell panel (status, connect/disconnect/reconnect, lockdown + auto-connect toggles, searchable country list with relay counts). Needs the `mullvad` CLI + a wasm-plugins build of mshell."

# Sandboxed WASM panel (mplugins WASM tier). A wasm-plugins build of mshell
# renders it in-shell; otherwise the pill falls back to the on_click below.
entry = "plugin.wasm"
entry_kind = "wasm"

[[widget]]
key = "vpn"
icon = "network-vpn-symbolic"
tooltip = "Mullvad VPN — click for the control panel"
# Pill label: the active relay, or "off". Polled every 10s.
exec = "mullvad status 2>/dev/null | awk 'NR==1{c=($1==\"Connected\")} /Relay:/{r=$2} END{print (c ? r : \"off\")}'"
template = "{output}"
interval = 10
max_chars = 18
opens_panel = true
on_click = "notify-send -- Mullvad \"$(mullvad status 2>/dev/null)\""
