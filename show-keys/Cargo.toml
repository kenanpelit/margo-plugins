# Show Keys — live keyboard input via `evtest` (port of noctalia show-keys).
[package]
name = "show-keys"
version = "0.1.2"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mplugin-sdk = { path = "../../margo/mplugin-sdk" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
