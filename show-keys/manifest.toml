id = "show-keys"
name = "Show Keys"
version = "0.1.3"
author = "kenanpelit"
min_mshell = "0.9.4"
description = "Live keyboard-input display via evtest. Useful for screen recordings + tutorials. Port of the noctalia plugin; uses the host's process-start capability for streaming evtest stdout. Needs your user in the `input` group + evtest installed."
icon = "input-keyboard-symbolic"

entry = "plugin.wasm"
entry_kind = "wasm"

[[widget]]
key = "main"
icon = "input-keyboard-symbolic"
tooltip = "Show Keys — click to open"
exec = "echo show-keys"
template = "{output}"
interval = 0
max_chars = 6
opens_panel = true
on_click = "notify-send -- 'Show Keys' 'Open the panel + tap Start to begin capturing.'"

[[keybind]]
combo       = "super+shift,k"
id          = "toggle"
description = "Open the show-keys panel + toggle capture."

[[setting]]
key         = "device"
label       = "Input device"
type        = "string"
default     = "/dev/input/event3"
description = "Path to a /dev/input/event* keyboard device. Run `cat /proc/bus/input/devices | grep -B5 KEYBOARD` to find yours."

[[setting]]
key         = "max_keys"
label       = "History depth"
type        = "number"
default     = "12"
description = "How many recent keys to keep visible."
