id = "mplayerplus"
name = "Media Player Plus"
version = "0.4.1"
author = "kenanpelit"
min_mshell = "0.9.4"
description = "A full media player panel for whatever's playing (MPRIS): album art, live progress, play/pause, prev/next, ±10s seek, shuffle & repeat. Controls the active player via playerctl. In-shell panel."

entry = "plugin.wasm"
entry_kind = "wasm"

# Suggested global hotkey: Super+Shift+M opens the player panel.
[[keybind]]
combo       = "super+shift,m"
id          = "open"
description = "Open the media player panel."

# ── Settings ────────────────────────────────────────────────────────────────
[[setting]]
key = "seek_step"
label = "Seek step (seconds)"
type = "string"
default = "10"
description = "How far the ⏪ / ⏩ buttons jump."

[[setting]]
key = "show_art"
label = "Show album art"
type = "choice"
choices = ["yes", "no"]
default = "yes"

# ── Bar pill ────────────────────────────────────────────────────────────────
# Shows the current "title — artist" live in the bar (via playerctl); click to
# open the full player panel. Hidden text when nothing's playing → just the icon.
[[widget]]
key = "player"
icon = "audio-x-generic-symbolic"
tooltip = "Media player — left-click to open · right-click to play/pause"
opens_panel = true
# Live album art (line 1 of the helper) + "title — artist" (line 2). `art`
# makes the leading image follow the helper's first line, reloaded each poll.
exec = "sh {{plugin_dir}}/nowplaying.sh"
template = "{output}"
art = true
interval = 3
max_chars = 32
# Right-click toggles playback (targets the active player).
on_click_right = "playerctl play-pause"
